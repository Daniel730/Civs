name: CivsTestHarness
version: 0.2.0
main: org.civs.itest.harness.TestHarnessPlugin
api-version: "1.21"
load: POSTWORLD
softdepend: [Civs, Vault, RPGServer]
description: "Integration-test harness: observation/assertions plus server-side player capabilities."
commands:
  test:
    description: "Civs integration-test harness command."
    usage: "/test <ping|money|assert|region|act|observe|held|inventory|permission|block|spawnentity|scheduler> ..."
