# Lint / dead-code / conventional PR titles for integration-tests/runner (#35, #42).
# Always runs on PRs so required status checks exist even when JS paths are unchanged.
name: runner-quality

on:
  pull_request:
  push:
    branches:
      - master
      - cursor/agent-platform-p1
      - feat/otel-integration-runner

jobs:
  changes:
    name: detect-runner-changes
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.filter.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            runner:
              - 'integration-tests/runner/**'
              - '.github/workflows/runner-quality.yml'

  biome-knip:
    name: Biome + knip
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration-tests/runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integration-tests/runner/package-lock.json
      - name: Install
        if: needs.changes.outputs.runner == 'true'
        run: npm ci
      - name: Biome check (format + lint)
        if: needs.changes.outputs.runner == 'true'
        run: npm run lint
      - name: Knip (unused files / deps)
        if: needs.changes.outputs.runner == 'true'
        run: npm run knip
      - name: Arch-contract (dependency-cruiser)
        if: needs.changes.outputs.runner == 'true'
        run: npm run arch
      - name: Unit tests
        if: needs.changes.outputs.runner == 'true'
        run: npm run test:unit
      - name: Skip notice
        if: needs.changes.outputs.runner != 'true'
        run: echo "No integration-tests/runner changes; Biome/knip/arch/unit skipped (pass)."

  commitlint:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integration-tests/runner/package-lock.json
      - name: Install commitlint
        working-directory: integration-tests/runner
        run: npm ci
      - name: Lint PR title
        working-directory: integration-tests/runner
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" | npx commitlint --config commitlint.config.cjs

  # Manual / self-hosted Paper integration — documented gate, not auto-run (#42).
  integration-manual:
    name: integration-manual (documented)
    runs-on: ubuntu-latest
    steps:
      - name: Documented integration job
        run: |
          cat <<'EOF'
          Integration scenarios require a live Paper 26.1.2 testserver + RCON
          (Hermes → MCP Gateway → runner → RawKeepAliveActor + RCON).

          Local / WSL (see docs/TESTING.md and docs/AGENT_PLATFORM.md):
            1. Start Paper testserver with Civs + Vault (+ economy provider).
            2. cd integration-tests/runner
            3. export RCON_* / MC_* / SERVER_LOG as documented
            4. npm test   # or: node run.js --scenario 07-move-to

          This GitHub Actions job is intentionally a no-op documentation check.
          Self-hosted runners may later replace this with a real Paper matrix.
          EOF
