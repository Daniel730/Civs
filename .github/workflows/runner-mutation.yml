# Optional / nightly mutation testing for critical runner libs (#37).
# Not a required PR gate — mutation runs are expensive.
name: runner-mutation

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC daily
    - cron: '0 6 * * *'
  pull_request:
    paths:
      - 'integration-tests/runner/lib/harness.js'
      - 'integration-tests/runner/lib/capabilities.js'
      - 'integration-tests/runner/lib/dsl.js'
      - 'integration-tests/runner/stryker.conf.cjs'
      - '.github/workflows/runner-mutation.yml'

jobs:
  stryker:
    name: stryker-mutation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration-tests/runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integration-tests/runner/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit smoke (mutation base)
        run: node --test test/dsl.test.js test/telemetry.test.js
      - name: Stryker (harness / capabilities / dsl)
        run: npm run test:mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-mutation-report
          path: |
            integration-tests/runner/reports/mutation/
          if-no-files-found: ignore
